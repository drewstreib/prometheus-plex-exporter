name: CI
# Ours, replacing upstream's. Differences that matter: builds -mod=mod (no vendor/ any more),
# and gates on govulncheck -- both source mode and BINARY mode. Binary mode is the one that
# catches an ageing Go toolchain: the exporter is statically linked, so every net/http and
# crypto/x509 fix ships only by rebuilding, and upstream's go1.23 shipped 26 reachable stdlib
# CVEs that source-mode scanning alone would never have shown.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catches newly-disclosed CVEs in code that has not changed.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -mod=mod -o ./bin/prometheus-plex-exporter ./cmd/prometheus-plex-exporter
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/upload-artifact@v4
        with:
          name: prometheus-plex-exporter-linux-${{ matrix.goarch }}
          path: ./bin

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck (source)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: build then govulncheck (binary — catches stdlib/toolchain CVEs)
        run: |
          CGO_ENABLED=0 GOOS=linux go build -mod=mod -o ./bin/prometheus-plex-exporter ./cmd/prometheus-plex-exporter
          go run golang.org/x/vuln/cmd/govulncheck@latest -mode=binary ./bin/prometheus-plex-exporter
